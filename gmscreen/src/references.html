<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
<title>References</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="references-page">
  <header class="app-toolbar">
    <h1>References</h1>
  </header>

  <nav class="page-tabs">
    <button type="button" class="tab-btn active" data-page="page-system-rules">System Rules</button>
    <button type="button" class="tab-btn" data-page="page-game-setting">Game Setting</button>
    <button type="button" class="tab-btn" data-page="page-combat-rules">Combat Rules</button>
  </nav>

  <main>
    <section id="page-system-rules" class="page active">
      <section class="block rules-block">
        <div class="block-header-row">
          <h2>System Rules</h2>
          <div class="rules-toolbar">
            <button type="button" id="system-rules-load" class="add-row-btn">Load Markdown File...</button>
            <span id="system-rules-filename" class="file-status">No file loaded</span>
          </div>
        </div>
        <div id="system-rules-content" class="markdown-pane">
          <p class="markdown-placeholder">Load a .md file to view System Rules here.</p>
        </div>
      </section>
    </section>

    <section id="page-game-setting" class="page">
      <section class="block rules-block">
        <div class="block-header-row">
          <h2>Game Setting</h2>
          <div class="rules-toolbar">
            <button type="button" id="game-setting-load" class="add-row-btn">Load Markdown File...</button>
            <span id="game-setting-filename" class="file-status">No file loaded</span>
          </div>
        </div>
        <div id="game-setting-content" class="markdown-pane">
          <p class="markdown-placeholder">Load a .md file to view the Game Setting here.</p>
        </div>
      </section>
    </section>

    <section id="page-combat-rules" class="page">
      <section class="block rules-block">
        <div class="block-header-row">
          <h2>Combat Rules</h2>
          <div class="rules-toolbar">
            <button type="button" id="combat-rules-load" class="add-row-btn">Load Markdown File...</button>
            <span id="combat-rules-filename" class="file-status">No file loaded</span>
          </div>
        </div>
        <div id="combat-rules-content" class="markdown-pane">
          <p class="markdown-placeholder">Load a .md file to view Combat Rules here.</p>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="js/references-renderer.js"></script>
</body>
</html>
