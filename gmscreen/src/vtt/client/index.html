<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14161b" />
    <title>VTT</title>
    <link rel="manifest" href="/vtt/manifest.webmanifest" />
    <link rel="icon" href="/vtt/icon.svg" type="image/svg+xml" />
    <script type="module" crossorigin src="/vtt/assets/main-Cn4BXMFg.js"></script>
    <link rel="modulepreload" crossorigin href="/vtt/assets/timing-BKsFoUhD.js">
    <link rel="stylesheet" crossorigin href="/vtt/assets/timing-Dy7JGh_D.css">
  </head>
  <body>
    <form id="lobby" class="panel" autocomplete="off" hidden>
      <h1 id="lobby-title">VTT</h1>
      <p id="lobby-sub" class="sub">Turn-based party play. Everyone with the same room code joins the same party.</p>
      <div class="lobby-grid">
        <div class="lobby-fields">
          <label>Your name <input id="name" maxlength="24" required /></label>
          <label id="room-field" hidden>Room code <input id="room" maxlength="8" pattern="[A-Za-z0-9]{3,8}" /></label>
          <label id="pin-field" hidden>Session PIN <input id="pin" inputmode="numeric" maxlength="6" placeholder="6 digits from the Storyteller" /></label>
          <div class="row">
            <label>Body <select id="av-gender"></select></label>
            <label>Hair <select id="av-style"></select></label>
          </div>
          <div class="row colors">
            <label>Skin <input id="av-skin" type="color" /></label>
            <label>Hair <input id="av-hair" type="color" /></label>
            <label>Outfit <input id="av-outfit" type="color" /></label>
          </div>
        </div>
        <div id="av-preview" aria-label="Avatar preview"></div>
      </div>
      <button type="submit">Join</button>
      <p id="lobby-error" class="error" role="alert"></p>
      <p id="st-line" class="sub" hidden>Running the game? <a id="st-link" href="storyteller.html">Open the Storyteller view</a></p>
    </form>

    <div id="game" hidden>
      <canvas id="view"></canvas>
      <div id="labels"></div>
      <header id="topbar">
        <span id="room-label"></span>
        <span id="round"></span>
        <span id="status" class="status"></span>
      </header>
      <div id="viewbar">
        <button id="rot-left" type="button" class="icon" title="Rotate left (Q)" aria-label="Rotate left">&#x27F2;</button>
        <button id="rot-right" type="button" class="icon" title="Rotate right (E)" aria-label="Rotate right">&#x27F3;</button>
        <button id="cutaway" type="button" class="icon" title="Low walls (C)" aria-label="Toggle low walls" aria-pressed="false">&#x25A4;</button>
      </div>
      <ol id="turns"></ol>
      <div id="stick" aria-hidden="true"><div class="knob"></div></div>
      <div id="actionbar">
        <span id="moves"></span>
        <button id="end-turn" type="button">End turn</button>
      </div>
      <ul id="log"></ul>
      <div id="toast" role="status"></div>
    </div>
  </body>
</html>
